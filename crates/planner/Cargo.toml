[package]
name = "planner"
version = "0.1.0"
edition = "2021"
description = "Mobile-robot motion planners (A*, RRT, RRT*) compiled to WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
