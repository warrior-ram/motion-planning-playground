[package]
name = "kinematics"
version = "0.1.0"
edition = "2021"
description = "Planar 2/3-link arm FK, DLS IK and joint-space RRT/RRT* planning, compiled to WASM"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
